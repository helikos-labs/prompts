name: Validate

# Every pull request must keep every entry valid and the site buildable.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check frontmatter and sections
        run: npm run validate
      - name: Unit tests for the validator
        run: npm test
      - name: Build the site
        run: npm run build
